<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Arcade Site</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #00ffcc;
            font-size: 2.5rem;
            margin-bottom: 30px;
        }
        /* Grid setup for games */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .game-card {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00ffcc;
            box-shadow: 0 8px 16px rgba(0, 255, 204, 0.2);
        }
        .game-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .game-title {
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <h1>🎮 Chromebook Arcade Hub 🎮</h1>
    <p>Select a game to start playing natively in your browser.</p>
    
    <div class="game-grid">
        <!-- Game 1: Clicker Heroes -->
        <a href="clicker-heroes.html" class="game-card">
            <div class="game-icon">⚔️</div>
            <div class="game-title">Clicker Heroes</div>
        </a>

        <!-- Game 2: Roblox Unblocked -->
        <a href="roblox.html" class="game-card">
            <div class="game-icon">🟥</div>
            <div class="game-title">Roblox</div>
        </a>
    </div>

</body>
</html>
