<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Workspace</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 40px;
        }
        .main-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            max-width: 900px;
            margin: 0 auto;
            padding: 10px;
        }
        .module-box {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 30px 20px;
            text-decoration: none;
            color: #f8fafc;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .module-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }
        .module-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        .module-title {
            font-weight: bold;
            font-size: 1.2rem;
            color: #f1f5f9;
        }
    </style>
</head>
<body>

    <h1>Classroom Resources & Core Modules</h1>
    <p>Select an assigned task module below to synchronize your local workspace canvas.</p>
    
    <div class="main-container">
        <!-- Slot 1: Clicker Heroes -->
        <a href="geometry-notes.html" class="module-box">
            <div class="module-icon">📐</div>
            <div class="module-title">Math Practice & Stats Module</div>
        </a>

        <!-- Slot 2: Slope -->
        <a href="space-module.html" class="module-box">
            <div class="module-icon">🔬</div>
            <div class="module-title">Physics 3D Simulation Engine</div>
        </a>

        <!-- Slot 3: Idle Digging Tycoon -->
        <a href="history-notes.html" class="module-box">
            <div class="module-icon">🏺</div>
            <div class="module-title">Historical Excavation & Mapping</div>
        </a>
    </div>

</body>
</html>
